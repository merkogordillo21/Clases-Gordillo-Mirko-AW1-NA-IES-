<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Javier Montalvo</title>
</head>
<body>

    <h1>Contacta a Javier</h1>
    
    <p>¿Listo para tomar el control de tus finanzas? Completa el siguiente formulario y me pondré en contacto contigo en menos de 24 horas para agendar una videollamada de 30 minutos sin cargo.</p>

    <form action="#" method="post">
        <p>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </p>
        
        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required>
        </p>
        
        <p>
            <label for="tamano">Tamaño actual de tu empresa:</label><br>
            <select id="tamano" name="tamano">
                <option value="1-5">De 1 a 5 empleados</option>
                <option value="6-15">De 6 a 15 empleados</option>
                <option value="mas-15">Más de 15 empleados</option>
            </select>
        </p>
        
        <p>
            <label for="desafio">Cuéntame brevemente cuál es tu mayor desafío financiero hoy:</label><br>
            <textarea id="desafio" name="desafio" rows="5" cols="40" required></textarea>
        </p>
        
        <p>
            <input type="submit" value="Enviar Consulta">
        </p>
    </form>

    <p>
        <a href="index.html">Volver a la página principal.</a>
    </p>

</body>
</html>
