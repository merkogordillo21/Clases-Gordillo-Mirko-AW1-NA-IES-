<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Retiro Sustentable - Ir al inicio" width="140">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main class="principal">
        <h1>Reservas</h1>
        <h2>Contactanos</h2>

        <form action="#" method="post">
            <div>
                <label for="nombre">Nombre de la persona que consulta</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="fecha-desde">Fecha desde</label>
                <input type="date" id="fecha-desde" name="fecha-desde" required>
            </div>

            <div>
                <label for="fecha-hasta">Fecha hasta</label>
                <input type="date" id="fecha-hasta" name="fecha-hasta" required>
            </div>

            <div>
                <label for="comentario">Comentario</label>
                <textarea id="comentario" name="comentario" rows="4"></textarea>
            </div>

            <button type="submit">Enviar consulta</button>
        </form>
    </main>

    <footer class="pie">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
