<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacto — Javier Montalvo</title>
<link rel="stylesheet" href="./resources/styles.css" />
</head>
<body>
<header>
<h1>Contacto</h1>
<nav>
<ul>
<li><a href="index.html">Quién soy</a></li>
<li><a href="contacto.html">Contacto</a></li>
</ul>
</nav>
</header>
<main>
  <section>
    <h2>Escribime</h2>
    <p>
      ¿Listo para tomar el control de tus finanzas? Completa el siguiente formulario y me pondré en contacto contigo en menos de 24 horas para agendar una videollamada de 30 minutos sin cargo.
    </p>

    <form action="index.html" method="get">
      <p>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required />
      </p>
      <p>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required />
      </p>
      <p>
        <label for="tamano">Tamaño actual de tu empresa</label>
        <select id="tamano" name="tamano">
          <option value="">Seleccioná una opción</option>
          <option value="1-5">De 1 a 5 empleados</option>
          <option value="6-15">De 6 a 15 empleados</option>
          <option value="mas-15">Más de 15 empleados</option>
        </select>
      </p>
      <p>
        <label for="desafio">Cuéntame brevemente cuál es tu mayor desafío financiero hoy</label>
        <textarea id="desafio" name="desafio" rows="4" required></textarea>
      </p>
      <p>
        <input type="submit" value="Enviar Consulta" />
      </p>
    </form>
  </section>
</main>

<footer>
  <p>2026 Javier Montalvo. Todos los derechos reservados.</p>
</footer>
</body>
</html>
