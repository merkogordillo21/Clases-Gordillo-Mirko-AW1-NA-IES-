<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Javier Montalvo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <nav class="site-nav">
            <h1 class="site-title">Javier Montalvo</h1>
            <ul class="nav-list">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-main">
        <section class="contact-section">
            <h2>Hablemos de tu negocio</h2>
            <p>¿Querés empezar a tomar el control de tus números? Dejame tus datos acá abajo y te escribo en menos de 24 horas para coordinar una videollamada de 30 minutos sin cargo.</p>
            
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="empresa">¿Qué tamaño tiene tu empresa?</label>
                    <select id="empresa" name="empresa">
                        <option value="1-5">De 1 a 5 empleados</option>
                        <option value="6-15">De 6 a 15 empleados</option>
                        <option value="mas-15">Más de 15 empleados</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="desafio">¿Cuál es tu mayor dolor de cabeza con los números hoy?</label>
                    <textarea id="desafio" name="desafio" rows="4"></textarea>
                </div>

                <button type="submit" class="submit-button">Coordinar charla</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Javier Montalvo - Consultoría Financiera para PyMEs.</p>
    </footer>

</body>
</html>
